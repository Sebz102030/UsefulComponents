name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mod version (example: 1.2.0 or 1.2.0-beta.1)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - release
          - beta

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="${{ inputs.version }}"
          sed -i "s/^mod_version=.*/mod_version=$VERSION/" gradle.properties

          echo "Version set to:"
          grep "^mod_version=" gradle.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradle.properties
          git commit -m "Set version to ${{ inputs.version }}" || echo "No changes to commit"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "${{ inputs.release_type == 'beta' && 'Beta ' || '' }}Release ${{ inputs.version }}"
          prerelease: ${{ inputs.release_type == 'beta' }}
          files: |
            build/libs/*.jar